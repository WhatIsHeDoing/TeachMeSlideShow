name: build

on:
    push:
        branches:
            - live
    pull_request:
    workflow_dispatch:

env:
    CI: 1

jobs:
    build:
        # https://github.com/actions/runner-images/blob/main/images/ubuntu/Ubuntu2404-Readme.md
        runs-on: ubuntu-24.04
        steps:
            - name: Checkout
              uses: actions/checkout@v5

            - name: Install pnpm
              uses: pnpm/action-setup@v4

            - name: Install dependencies
              run: pnpm install

            - name: Run the CI script
              run: pnpm run ci
